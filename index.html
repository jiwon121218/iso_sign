<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>심사 참석자 서명</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="심사 서명">
<meta name="theme-color" content="#f7f4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ef; --card:#fffdfa; --line:#e4ded4; --ink:#2b2f36; --dim:#7b8290;
    --accent:#4a6fa5; --accent-sf:#eaf0f8; --ok:#3f7d58; --ok-sf:#e9f3ec;
    --warn-sf:#fdf3e3; --warn-ln:#e8d4ab;
    --pad-top:env(safe-area-inset-top,0px); --pad-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  body{padding:calc(14px + var(--pad-top)) 14px calc(20px + var(--pad-bot))}
  h1{font-size:17px;margin:0 0 2px}
  .sub{font-size:12.5px;color:var(--dim);margin:0 0 14px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:12px}
  label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 0 5px}
  input[type=text]{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-sf)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;gap:8px;margin-top:4px}
  .seg button{flex:1;padding:11px 8px;font-size:14px;font-weight:600;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--dim);font-family:inherit}
  .seg button.on{background:var(--accent-sf);border-color:var(--accent);color:var(--accent)}
  .padwrap{position:relative;margin-top:4px}
  canvas{width:100%;height:230px;display:block;background:#fff;border:1px dashed #cfc8bc;
    border-radius:10px;touch-action:none}
  .guideline{position:absolute;left:18px;right:18px;bottom:52px;border-bottom:1px solid #e7e0d4;
    pointer-events:none}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#c3bbae;font-size:14px;pointer-events:none}
  .row{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}
  .btn{padding:11px 16px;font-size:14px;font-weight:600;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-family:inherit}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.big{flex:1;padding:14px}
  .sp{flex:1}
  .note{background:var(--warn-sf);border:1px solid var(--warn-ln);border-radius:9px;
    padding:10px 12px;font-size:12.3px;line-height:1.6;color:#6b5a38;margin-top:11px}
  .done{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);
    font-size:13px}
  .done:first-child{border-top:0}
  .done img{height:30px;max-width:110px;object-fit:contain}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--ok-sf);color:var(--ok);
    font-weight:600}
  .tag.b{background:var(--accent-sf);color:var(--accent)}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:14px 0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--pad-bot));
    background:#2b2f36;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88vw;text-align:center}
  .toast.on{opacity:.95}
  #sakura-sig{position:fixed;right:0;bottom:0;width:140px;height:100px;z-index:40;pointer-events:auto}
  #sakura-jw{position:absolute;right:16px;bottom:12px;font-family:'Great Vibes',cursive;
    font-size:22px;color:#f5c6d6;opacity:0;transition:opacity .5s;pointer-events:none}
</style>
</head>
<body>

<div class="note" id="boot" style="margin:0 0 12px">
  <b>이 줄이 계속 보이면 서명이 되지 않는 화면입니다.</b><br>
  아이폰 ‘파일’ 앱이나 카톡 안에서 바로 열면 그림을 그릴 수 없습니다.
  크롬·사파리 같은 브라우저에서 열어 주세요.
</div>

<h1>심사 참석자 서명</h1>
<p class="sub">이름을 적고 아래 칸에 서명한 뒤 <b>저장</b>을 누르세요.
  저장한 그림을 심사원 노트북으로 보내면 참석자 명단에 들어갑니다.</p>

<div class="card">
  <div class="grid2">
    <div><label for="company">업체명 (선택)</label>
      <input type="text" id="company" placeholder="예: ○○산업"></div>
    <div><label for="who">참석자 이름</label>
      <input type="text" id="who" placeholder="예: 홍길동" autocomplete="off"></div>
  </div>
  <div style="margin-top:11px">
    <label>회의 구분</label>
    <div class="seg" id="phase">
      <button data-p="시작회의" class="on">시작회의</button>
      <button data-p="종결회의">종결회의</button>
    </div>
  </div>
</div>

<div class="card">
  <label>서명</label>
  <div class="padwrap">
    <canvas id="pad"></canvas>
    <div class="guideline"></div>
    <div class="ph" id="ph">여기에 서명하세요</div>
  </div>
  <div class="row">
    <button class="btn" id="clear">지우기</button>
    <div class="sp"></div>
    <button class="btn pri big" id="save">저장</button>
  </div>
  <div class="note" id="iosNote" hidden>
    아이폰에서는 저장을 누르면 그림이 새 창으로 열립니다.
    그림을 <b>길게 눌러 ‘사진에 저장’</b>을 고르세요.
  </div>
</div>

<div class="card">
  <label>받은 서명 <span id="cnt" style="color:var(--accent)">0</span></label>
  <div id="list"><div class="empty">아직 받은 서명이 없습니다</div></div>
</div>

<div class="toast" id="toast"></div>
<div id="sakura-sig"><div id="sakura-jw">jw</div></div>

<script>
const $ = (s) => document.querySelector(s);
const pad = $('#pad'), cx = pad.getContext('2d');
let drawing = false, dirty = false, phase = '시작회의';
const DONE = [];
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS) $('#iosNote').hidden = false;

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => (t.className = 'toast'), 2200);
}

/* ── 캔버스 ── */
function fit() {
  const r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const keep = dirty ? pad.toDataURL() : null;
  pad.width = Math.round(r.width * dpr);
  pad.height = Math.round(r.height * dpr);
  cx.lineWidth = 2.6 * dpr; cx.lineCap = 'round'; cx.lineJoin = 'round';
  cx.strokeStyle = '#1b2733';
  if (keep) { const im = new Image(); im.onload = () => cx.drawImage(im, 0, 0, pad.width, pad.height); im.src = keep; }
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 220));
fit();

const pos = (e) => {
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) * (pad.width / r.width), (e.clientY - r.top) * (pad.height / r.height)];
};
pad.addEventListener('pointerdown', (e) => {
  drawing = true; dirty = true; $('#ph').hidden = true;
  pad.setPointerCapture(e.pointerId);
  const [x, y] = pos(e); cx.beginPath(); cx.moveTo(x, y);
});
pad.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const [x, y] = pos(e); cx.lineTo(x, y); cx.stroke();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) =>
  pad.addEventListener(t, () => (drawing = false)));

/* 포인터 이벤트가 오지 않는 화면(구형 웹뷰 등)을 위한 터치 보조.
   포인터로 이미 그려졌으면 터치는 건너뛴다 — 두 번 그려지면 안 된다. */
let usedPointer = false;
pad.addEventListener('pointerdown', () => (usedPointer = true), { once: true });
function tpos(t) {
  const r = pad.getBoundingClientRect();
  return [(t.clientX - r.left) * (pad.width / r.width),
          (t.clientY - r.top) * (pad.height / r.height)];
}
pad.addEventListener('touchstart', (e) => {
  if (usedPointer) return;
  dirty = true; $('#ph').hidden = true;
  const [x, y] = tpos(e.touches[0]); cx.beginPath(); cx.moveTo(x, y);
  e.preventDefault();
}, { passive: false });
pad.addEventListener('touchmove', (e) => {
  if (usedPointer) { e.preventDefault(); return; }
  const [x, y] = tpos(e.touches[0]); cx.lineTo(x, y); cx.stroke();
  e.preventDefault();
}, { passive: false });

function clearPad() {
  cx.clearRect(0, 0, pad.width, pad.height);
  dirty = false; $('#ph').hidden = false;
}
$('#clear').addEventListener('click', clearPad);

/* ── 회의 구분 ── */
$('#phase').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#phase button').forEach((x) => x.classList.toggle('on', x === b));
  phase = b.dataset.p;
});

/* ── 여백을 잘라내고 투명 배경으로 ──
   노트북 서명칸은 가로로 길다. 그린 부분만 남겨야 칸에 꽉 차게 들어간다. */
function trim() {
  const w = pad.width, h = pad.height;
  const d = cx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 24) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return null;
  const m = Math.round(8 * (window.devicePixelRatio || 1));
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
  x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
  const sw = x1 - x0 + 1, sh = y1 - y0 + 1;
  const scale = Math.min(1, 520 / sw);
  const out = document.createElement('canvas');
  out.width = Math.round(sw * scale); out.height = Math.round(sh * scale);
  out.getContext('2d').drawImage(pad, x0, y0, sw, sh, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

const safe = (s) => (s || '').trim().replace(/[^\w가-힣.-]+/g, '_').replace(/^_+|_+$/g, '');

async function hand(dataUrl, fname) {
  const blob = await (await fetch(dataUrl)).blob();
  const file = new File([blob], fname, { type: 'image/png' });
  // 아이폰은 내려받기가 막혀 있다 — 공유 시트가 있으면 그쪽이 훨씬 편하다
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: fname }); return '공유'; }
    catch (e) { if (e.name === 'AbortError') return '취소'; }
  }
  const a = document.createElement('a');
  a.href = dataUrl; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  if (isIOS) window.open(dataUrl, '_blank');
  return '저장';
}

$('#save').addEventListener('click', async () => {
  const who = $('#who').value.trim();
  if (!who) { toast('참석자 이름을 먼저 적으세요'); $('#who').focus(); return; }
  if (!dirty) { toast('서명이 비어 있습니다'); return; }
  const img = trim();
  if (!img) { toast('서명을 찾지 못했습니다. 다시 그려 주세요'); return; }

  const fname = `${safe(who)}_${phase}.png`;
  const how = await hand(img, fname);
  if (how === '취소') return;

  DONE.unshift({ who, phase, img, fname });
  paint();
  clearPad();
  $('#who').value = '';
  $('#who').focus();
  toast(`${who} · ${phase} 서명을 ${how}했습니다`);
});

function paint() {
  $('#cnt').textContent = DONE.length;
  $('#list').innerHTML = DONE.length
    ? DONE.map((r, i) => `
      <div class="done">
        <b>${r.who}</b>
        <span class="tag ${r.phase === '시작회의' ? 'b' : ''}">${r.phase}</span>
        <img src="${r.img}" alt="서명">
        <span class="sp"></span>
        <button class="btn" style="padding:6px 11px;font-size:12.5px" data-re="${i}">다시 저장</button>
      </div>`).join('')
    : '<div class="empty">아직 받은 서명이 없습니다</div>';
}
$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-re]'); if (!b) return;
  const r = DONE[+b.dataset.re];
  hand(r.img, r.fname).then((how) => { if (how !== '취소') toast(`${r.who} 서명을 ${how}했습니다`); });
});

window.addEventListener('beforeunload', (e) => {
  if (DONE.length || dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* 여기까지 왔으면 스크립트가 도는 화면이다 */
$('#boot').remove();

/* 벚꽃 시그니처 */
(function () {
  const zone = document.getElementById('sakura-sig'), jw = document.getElementById('sakura-jw');
  let timer = null, active = false;
  function petal() {
    const p = document.createElement('div');
    const s = 5 + Math.random() * 7;
    p.style.cssText =
      `position:absolute;width:${s}px;height:${s * 0.85}px;` +
      'background:radial-gradient(circle at 30% 30%, #fde6ee, #f3b9cd);' +
      `border-radius:${s}px ${s * 0.2}px ${s}px ${s * 0.2}px;` +
      `right:${Math.random() * 130}px;bottom:${Math.random() * 20}px;` +
      `opacity:${0.6 + Math.random() * 0.4};pointer-events:none;` +
      `transform:rotate(${Math.random() * 360}deg);`;
    zone.appendChild(p);
    const dx = (Math.random() - 0.5) * 110, dy = -(50 + Math.random() * 90);
    const rot = Math.random() * 720 - 360;
    p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: p.style.opacity },
      { transform: `translate(${dx * 0.4}px,${dy * 0.45}px) rotate(${rot * 0.4}deg)`, opacity: 0.85 },
      { transform: `translate(${dx}px,${dy}px) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 1500 + Math.random() * 1300, easing: 'cubic-bezier(.25,.6,.4,1)' })
      .onfinish = () => p.remove();
  }
  const on = () => {
    if (active) return;
    active = true;
    for (let i = 0; i < 18; i++) setTimeout(petal, i * 28);
    jw.style.opacity = '1';
    timer = setInterval(petal, 280);
  };
  const off = () => { active = false; clearInterval(timer); timer = null; jw.style.opacity = '0'; };
  zone.addEventListener('mouseenter', on);
  zone.addEventListener('mouseleave', off);
  zone.addEventListener('touchstart', () => { on(); setTimeout(off, 2600); }, { passive: true });
})();
</script>
</body>
</html>
